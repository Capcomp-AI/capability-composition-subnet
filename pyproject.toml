[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-subnet"
version = "2.0.0"
description = "LoRA Merger — the Capability Composition Subnet on Bittensor. Miners submit declarative merge recipes over a certified LoRA pool; a continuous champion-challenge engine scores them on a hidden agentic workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Capability Composition Subnet" }]
keywords = ["bittensor", "lora", "model-merging", "peft", "agentic-evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The base install is what a *delegated* validator needs, and nothing more: it
# reconstructs nothing, serves nothing and scores nothing — it fetches a signed
# vector, verifies it, replays a closed window from published traces, and sets
# weights. Declaring torch here made that install 1.7 GB of tensor library that
# validator never imports, against a documented 20 GB VPS.
#
# It is NOT enough for the default mode. `--neuron.evaluation` defaults to 'own',
# where a validator rebuilds and measures every candidate on its own hardware and
# therefore needs `capability-subnet[merge]`. Without it such a validator cannot
# even parse a committed recipe — validating a Recipe resolves the merge method,
# which imports torch — and because reconstruction failure is a scored outcome
# rather than an error, the visible result is every miner scored zero for this
# host's missing dependency. The validator now refuses to start instead; see
# validator/neuron.py::_preflight_own_evaluation.
#
# The layering this reflects is real and enforced by tests/unit/test_layering.py:
# common, workflows, scoring, miner, validator and audit import nothing heavy.
dependencies = [
  "bittensor>=11.0.0,<12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "PyYAML>=6.0",
  "rich>=13.0",
  # The default workflow draws its instances from two pinned corpora, and a
  # validator regenerates those instances to re-score a closed window. Without
  # these it can fetch a disclosure and then fail to check it — which is the one
  # thing a validator exists to do. Far smaller than the tensor stack, and not
  # optional for anyone who verifies.
  "huggingface_hub>=0.23",
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
# Reconstruction: the merge engine and the certified pool it reads. Needed by
# anyone who turns a recipe into weights — the engine, and any miner evaluating
# locally.
merge = [
  "torch>=2.2",
  "numpy>=1.26",
  "safetensors>=0.4",
]
# The sandbox tool services, which run in their own container.
sandbox = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psycopg[binary]>=3.1",
]
# Miners who want local reconstruction and evaluation.
miner = [
  "capability-subnet[merge]",
  "transformers>=4.44",
  "huggingface_hub>=0.23",
]
# Importing and certifying the pool from upstream Hugging Face repositories.
registry = [
  "capability-subnet[merge]",
  "huggingface_hub>=0.23",
]
dev = [
  "capability-subnet[merge,miner,registry,sandbox]",
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
capability-miner = "capability_subnet.miner.cli:main"
capability-validator = "capability_subnet.validator.neuron:main"
capability-workflow = "capability_subnet.workflows.cli:main"
capability-registry = "capability_subnet.registry.cli:main"
capability-audit = "capability_subnet.audit.cli:main"

[tool.setuptools.packages.find]
include = ["capability_subnet*"]

[tool.setuptools.package-data]
capability_subnet = [
  "registry/data/*.json",
  "workflows/**/*.json",
  "workflows/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "gpu: requires a CUDA device and the pinned base model",
  "docker: requires a working Docker daemon",
  "chain: requires a reachable subtensor endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
