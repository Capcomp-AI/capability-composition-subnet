# Local checks, matching what CI runs so a failure shows up before the push
# rather than after it.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Adapters and artifacts are large and content-addressed; they belong in
        # the pool or the artifact cache, never in the repository.
        args: [--maxkb=512]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
