# Minimum compute requirements per role.
#
# The three roles in this subnet have very different hardware profiles:
#   miner     — searches composition space privately; hardware is entirely the
#               miner's choice. The numbers below describe what the reference
#               local search + local evaluation loop needs.
#   validator — thin weight-setter. No GPU, no model, no adapter downloads.
#   backend   — runs reconstruction, serving and sandboxed evaluation. This is
#               operated by the subnet owner, not by the general public.

version: "2.0.0"

miner:
  # A miner can do useful work with nothing but a CPU (recipe construction and
  # schema validation), but reproducing the local evaluation harness against the
  # public pack needs a GPU that fits Qwen3-8B in bf16.
  cpu:
    min_cores: 8
    min_speed: 2.5          # GHz
    recommended_cores: 16
  gpu:
    required: false         # required only for local evaluation
    min_vram: 24            # GB — matches the peak-VRAM deployment gate
    recommended_vram: 48
    cuda_cores: 5000
    min_compute_capability: 8.0
  memory:
    min_ram: 32             # GB
    recommended_ram: 64
    min_swap: 8
  storage:
    min_space: 250          # GB — base model + certified adapter pool + candidates
    recommended_space: 500
    type: SSD
    min_iops: 1000
  os:
    name: Ubuntu
    version: 22.04
  network:
    bandwidth:
      download: 200         # Mbps
      upload: 50

validator:
  # Sized for `--neuron.evaluation=own`, the default, in which the validator
  # rebuilds every candidate on its own hardware, serves it through its own
  # endpoint and scores it against instances it regenerates. It loads an 8B model
  # with a rank-64 adapter applied.
  #
  # 48 GB rather than the ~18 GB the model actually occupies: a candidate's peak
  # is gated at 24 GiB, vLLM reserves a fraction of the whole card, and a card
  # sized to the model leaves no room to set that fraction low enough to stay
  # under the gate while holding cache blocks. Set
  # serving_gpu_memory_utilization to 0.45 on a 48 GB card.
  #
  # `--neuron.evaluation=delegated` reconstructs nothing and needs no GPU:
  # 2 cores, 4 GB RAM, 20 GB disk.
  cpu:
    min_cores: 8
    min_speed: 2.5
    recommended_cores: 16
  gpu:
    required: true
    min_vram: 48
    recommended_vram: 48
  memory:
    min_ram: 32
    recommended_ram: 64
    min_swap: 8
  storage:
    # Base model ~16 GB, adapter pool ~9 GB, artifacts, state and kernel caches.
    min_space: 120
    recommended_space: 250
    type: SSD
    min_iops: 500
  os:
    name: Ubuntu
    version: 22.04
  network:
    bandwidth:
      download: 100
      upload: 20

backend:
  # Owner-operated evaluation engine. Sizing is per evaluation worker; the
  # scheduler, monitor and API can share one smaller control-plane host.
  #
  # GPU memory, measured against the pinned base model rather than estimated:
  #
  #   base weights (bf16)                    15.26 GB
  #   KV cache, one 16384-token sequence      2.25 GB   (144 KB/token)
  #   merged adapter at rank 64               0.33 GB
  #   CUDA graphs, activations, workspace    ~1.50 GB
  #   ------------------------------------------------
  #   minimum to serve one candidate         19.33 GB
  #
  # Reconstruction is a separate, much smaller cost: peak is ~1.5 GB and is
  # flat in the number of selected adapters, because the merge streams one
  # update at a time rather than stacking them. It can share the serving card
  # or run on any other.
  #
  # 24 GB is verified sufficient, not merely arithmetically adequate. A merged
  # rank-64 adapter was served on a single RTX 4090 through the engine's own
  # ManagedVllmServer, and both request shapes the protocol uses succeeded:
  #
  #   startup                                    67 s
  #   peak GPU memory (NVML, under load)      22.89 GB
  #   GPU KV cache                          73,968 tokens
  #   concurrency at full 16384 context           4.51x
  #
  # Two settings make the difference and both are safe:
  #   --kv-cache-dtype fp8   halves KV cost; this quantises the *cache*, not
  #                          the weights, so canonical scores stay bfloat16
  #   --max-num-seqs 1       the engine evaluates one sequence at a time anyway
  #
  # Quantising the *weights* would free ~8 GB and is forbidden: the contract
  # requires bfloat16 for every canonical score, because a package measured at
  # a different precision is a different package.
  #
  # 48 GB is still the recommendation, for context growth or concurrent
  # evaluation, but it is a preference rather than a requirement.
  cpu:
    min_cores: 32
    min_speed: 3.0
    recommended_cores: 64
  gpu:
    required: true
    min_vram: 24            # measured: 19.33 GB to serve, 1.5 GB to reconstruct
    recommended_vram: 48    # room for context growth and concurrent evaluation
    count: 1                # per concurrent sandbox
    min_compute_capability: 8.0
  memory:
    min_ram: 128
    recommended_ram: 256
    min_swap: 16
  storage:
    min_space: 2000         # GB — artifact cache, sample rows, signed reports
    recommended_space: 4000
    type: NVMe
    min_iops: 20000
  os:
    name: Ubuntu
    version: 22.04
  docker:
    required: true
    min_version: "24.0"
  network:
    bandwidth:
      download: 1000
      upload: 500
