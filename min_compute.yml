# Minimum compute requirements per role.
#
# The three roles in this subnet have very different hardware profiles:
#   miner     — searches composition space privately. Submitting a recipe needs
#               no GPU; evaluating one does, and evaluating is how a recipe
#               worth submitting is found. The numbers below describe the
#               reference local search + evaluation loop.
#   validator — rebuilds, serves and scores every candidate on its own cards.
#               The GPU floor is mandatory and enforced at start-up:
#               MIN_VALIDATOR_CARDS and MIN_VALIDATOR_CARD_GIB.
#   backend   — the same work, run by whoever publishes a reference set of
#               numbers and a console alongside their validator.

version: "2.0.0"

miner:
  # A miner can do useful work with nothing but a CPU (recipe construction and
  # schema validation), but reproducing the local evaluation harness against the
  # public pack needs a GPU that fits Qwen3-8B in bf16.
  cpu:
    min_cores: 8
    min_speed: 2.5          # GHz
    recommended_cores: 16
  gpu:
    required: false         # required only for local evaluation
    min_vram: 32            # GB — a candidate reserves 24 GiB while served
    recommended_vram: 48
    cuda_cores: 5000
    min_compute_capability: 8.0
  memory:
    min_ram: 32             # GB
    recommended_ram: 64
    min_swap: 8
  storage:
    min_space: 250          # GB — base model + certified adapter pool + candidates
    recommended_space: 500
    type: SSD
    min_iops: 1000
  os:
    name: Ubuntu
    version: 22.04
  network:
    bandwidth:
      download: 200         # Mbps
      upload: 50

validator:
  # A validator rebuilds every candidate on its own hardware, serves it through
  # its own endpoint and scores it against instances it regenerates. It loads an
  # 8B model with a rank-64 adapter applied. There is no lighter mode: a host
  # that cannot measure a candidate refuses to start rather than score every
  # miner zero for its own missing dependency.
  #
  # 48 GB rather than the ~18 GB the model actually occupies: a candidate's peak
  # is gated at 24 GiB, vLLM reserves a fraction of the whole card, and a card
  # sized to the model leaves no room to set that fraction low enough to stay
  # under the gate while holding cache blocks. Set
  # serving_gpu_memory_utilization to 0.45 on a 48 GB card.

  cpu:
    # Reconstruction is pinned to one torch thread for byte-identical merges,
    # so each merge saturates exactly one core. Cores shorten a run.
    min_cores: 16
    min_speed: 2.5
    recommended_cores: 32
  gpu:
    required: true
    min_vram: 32            # MIN_VALIDATOR_CARD_GIB; refused below this
    recommended_vram: 48
    min_count: 4            # MIN_VALIDATOR_CARDS; refused below this
    recommended_count: 8
  memory:
    # A merge holds 1-4 GB and several run at once while the fleet serves.
    min_ram: 64
    recommended_ram: 128
    min_swap: 8
  storage:
    # Base model ~16 GB, adapter pool ~9 GB, artifacts, state and kernel caches.
    min_space: 120
    recommended_space: 250
    type: SSD
    min_iops: 500
  os:
    name: Ubuntu
    version: 22.04
  network:
    bandwidth:
      download: 100
      upload: 20

backend:
  # Owner-operated evaluation engine. Sizing is per evaluation worker; the
  # scheduler, monitor and API can share one smaller control-plane host.
  #
  # GPU memory, measured against the pinned base model rather than estimated:
  #
  #   base weights (bf16)                    15.26 GB
  #   KV cache, one 16384-token sequence      2.25 GB   (144 KB/token)
  #   merged adapter at rank 64               0.33 GB
  #   CUDA graphs, activations, workspace    ~1.50 GB
  #   ------------------------------------------------
  #   minimum to serve one candidate         19.33 GB
  #
  # Reconstruction is a separate, much smaller cost: peak is ~1.5 GB and is
  # flat in the number of selected adapters, because the merge streams one
  # update at a time rather than stacking them. It can share the serving card
  # or run on any other.
  #
  # 32 GB is the floor, enforced by MIN_VALIDATOR_CARD_GIB. A candidate reserves
  # 24 GiB, the driver context holds ~1 GiB, and a merge sharing the card peaks
  # near 2.5 GiB — ~27.5 GiB before a card serves and reconstructs at once.
  #
  # The 24 GB figures below were measured when the reservation was 20 GiB, on a
  # single RTX 4090 through the engine's own ManagedVllmServer. They are kept
  # because they are real measurements of a real run; they describe the older,
  # smaller reservation and a 24 GB card no longer clears the floor:
  #
  #   startup                                    67 s
  #   peak GPU memory (NVML, under load)      22.89 GB
  #   GPU KV cache                          73,968 tokens
  #   concurrency at full 16384 context           4.51x   (served at 8192 now)
  #
  # Two settings make the difference and both are safe:
  #   --kv-cache-dtype fp8   halves KV cost; this quantises the *cache*, not
  #                          the weights, so canonical scores stay bfloat16
  #   --max-num-seqs 32      matches SANDBOX_BATCH_CONCURRENCY; it was 1 while
  #                          latency was scored, since a queued request would
  #                          have been timed as a slow one
  #
  # Quantising the *weights* would free ~8 GB and is forbidden: the contract
  # requires bfloat16 for every canonical score, because a package measured at
  # a different precision is a different package.
  #
  # Four such cards is the enforced minimum (MIN_VALIDATOR_CARDS); eight is the
  # recommendation. The floor is challenger throughput at a short run, not
  # the reference schedule, which one card finishes comfortably.
  cpu:
    min_cores: 32
    min_speed: 3.0
    recommended_cores: 64
  gpu:
    required: true
    min_vram: 32            # 24 GiB reserved to serve, ~2.5 GB to reconstruct
    recommended_vram: 48    # room for context growth and concurrent evaluation
    count: 4                # merges and evaluations run across the whole fleet
    min_compute_capability: 8.0
  memory:
    min_ram: 128
    recommended_ram: 256
    min_swap: 16
  storage:
    min_space: 2000         # GB — artifact cache, sample rows, signed reports
    recommended_space: 4000
    type: NVMe
    min_iops: 20000
  os:
    name: Ubuntu
    version: 22.04
  docker:
    required: true
    min_version: "24.0"
  network:
    bandwidth:
      download: 1000
      upload: 500
